
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paida All — Каталог</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 1em;
    }
    header {
      background: #fff;
      padding: 1em;
      text-align: center;
      border-bottom: 1px solid #ccc;
    }
    header h1 {
      margin: 0;
    }
    .contact {
      font-size: 0.9em;
      color: #555;
    }
    .notice {
      background: #fffae6;
      padding: 0.8em;
      margin: 1em auto;
      border-left: 4px solid #ffd700;
      max-width: 600px;
      font-size: 0.9em;
    }
    .whatsapp-link {
      position: fixed;
      top: 1em;
      right: 1em;
      background-color: #25d366;
      color: white;
      padding: 0.5em 1em;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
    .search-box {
      text-align: center;
      margin: 1em 0;
    }
    .search-box input {
      padding: 0.6em;
      width: 90%;
      max-width: 400px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .cards-container {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 1em;
      width: 180px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img {
      max-width: 100%;
      border-radius: 8px;
    }
    .title {
      font-weight: bold;
      margin-top: 0.5em;
    }
    .price {
      color: green;
      font-weight: bold;
      margin-top: 0.3em;
    }
    .admin-panel {
      background: #fff;
      padding: 1em;
      margin-top: 2em;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .admin-panel input {
      margin: 0.5em 0;
      padding: 0.5em;
      width: calc(100% - 1em);
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .admin-panel button {
      padding: 0.6em 1.2em;
      margin-top: 0.5em;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <a class="whatsapp-link" href="https://wa.me/77780855478" target="_blank">WhatsApp</a>
  <header>
    <h1>Paida All</h1>
    <div class="contact">
      г. Караганда, ул. Алиханова 37 (цокольный этаж) <br>
      Время работы: 13:00–20:00 <br>
      Тел: 8 (778) 085-54-78
    </div>
  </header>

  <div class="notice">
    Заказы после 13:00 обрабатываются на следующий день. Доступна доставка и самовывоз.
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск по товарам...">
  </div>

  <div class="cards-container" id="catalog"></div>

  <div class="admin-panel">
    <h3>Добавить товар</h3>
    <input id="idInput" placeholder="ID или артикул">
    <input id="nameInput" placeholder="Название">
    <input id="priceInput" placeholder="Цена">
    <input id="imgInput" placeholder="Ссылка на изображение">
    <button onclick="addProduct()">Добавить</button>
  </div>

  <script>
    let data = [
      { id: "1001", name: "СМС BiMax 400 гр", price: "650", img: "https://via.placeholder.com/150" },
      { id: "2001", name: "PEROS 1500 гр Белое", price: "1600", img: "https://via.placeholder.com/150" },
      { id: "3001", name: "Аист 400 гр SOFT", price: "800", img: "https://via.placeholder.com/150" },
    ];

    function renderCards(items) {
      const catalog = document.getElementById("catalog");
      catalog.innerHTML = "";
      items.forEach(({ id, name, price, img }) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${img}" alt="${name}" onclick="window.open('${img}')">
          <div class="title">${name}</div>
          <div class="price">${price} ₸</div>
          <div style="font-size:0.8em;color:#888;">ID: ${id}</div>
        `;
        catalog.appendChild(card);
      });
    }

    function addProduct() {
      const id = document.getElementById("idInput").value;
      const name = document.getElementById("nameInput").value;
      const price = document.getElementById("priceInput").value;
      const img = document.getElementById("imgInput").value || "https://via.placeholder.com/150";

      if (!id || !name || !price) return alert("Заполните все поля");

      data.push({ id, name, price, img });
      renderCards(data);

      document.getElementById("idInput").value = "";
      document.getElementById("nameInput").value = "";
      document.getElementById("priceInput").value = "";
      document.getElementById("imgInput").value = "";
    }

    document.getElementById("searchInput").addEventListener("input", e => {
      const val = e.target.value.toLowerCase();
      renderCards(data.filter(p => p.name.toLowerCase().includes(val)));
    });

    renderCards(data);
  </script>
</body>
</html>
