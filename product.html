<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Товар</title>
  <meta name="description" content="Товар магазина Paida All">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Подключаем твои стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1 class="logo">Paida All</h1>
</header>

<main class="container">
  <div class="product-card product-page">

    <img id="product-image" class="product-image" src="" alt="">

    <div class="product-info">
      <div id="product-name" class="product-name"></div>
      <div id="product-price" class="product-price"></div>
      <div id="product-description" class="product-description"></div>

      <div class="product-actions">
        <button class="add-to-cart" onclick="orderWhatsapp()">
          Заказать в WhatsApp
        </button>
        <a href="index.html" style="margin-left:10px">← Назад</a>
      </div>
    </div>

  </div>
</main>

<script>
const SUPABASE_URL = "https://qmnnbotyzwftlhwakbnz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbm5ib3R5endmdGxod2FrYm56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTIwOTE3MzYsImV4cCI6MjA2NzY2NzczNn0.QaHkN4M4_Deh4HN4CZ-spv8QKbGKzhrfGwMvr6Pbyv4";

const slug = new URLSearchParams(location.search).get("slug");

async function loadProduct() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/products?slug=eq.${slug}`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    }
  );

  const data = await res.json();
  if (!data.length) {
    document.body.innerHTML = "Товар не найден";
    return;
  }

  const p = data[0];

  document.title = `${p.name} – купить | Paida All`;
  document.querySelector('meta[name="description"]').content =
    `Купить ${p.name} по выгодной цене. Paida All.`;

  document.getElementById("product-name").textContent = p.name;
  document.getElementById("product-price").textContent =
    p.price ? `${p.price.toLocaleString('ru-RU')} ₸` : '';
  document.getElementById("product-description").textContent = p.description || '';
  document.getElementById("product-image").src =
    p.img || 'https://via.placeholder.com/300';
  document.getElementById("product-image").alt = p.name;
}

function orderWhatsapp() {
  window.open(
    "https://wa.me/77780855478?text=" +
    encodeURIComponent("Здравствуйте! Хочу заказать: " + document.title)
  );
}

loadProduct();
</script>

</body>
</html>
